services:
  api:
    build: .
    ports:
      - "3001:3001"
    env_file: .env
    restart: unless-stopped
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  erebor:
    image: haeli05/erebor:latest
    ports:
      - "3002:3000"
    volumes:
      - erebor-data:/data/keys
    environment:
      - EREBOR_SECRET=${EREBOR_SECRET:-change-me}
      - NETWORK=polygon-amoy
    restart: unless-stopped

volumes:
  mongo-data:
  erebor-data:
